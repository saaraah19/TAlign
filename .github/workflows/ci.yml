# Continuous integration: every push to main and every pull request runs the
# same checks a developer runs locally, so a change that breaks something is
# caught before it is merged rather than discovered later.
#
# Three independent jobs run in parallel, so one failure doesn't hide another:
#   backend   - the pytest suite (no database or API keys needed: the tests
#               use mocked repositories and a fake AI provider)
#   frontend  - TypeScript type-check, ESLint, and the Vitest component tests
#   build     - a real `next build`, which catches problems the type-checker
#               can't (bad route config, a page that fails to render, ...)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # the version the backend Dockerfile uses
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # the version the frontend Dockerfile uses
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
